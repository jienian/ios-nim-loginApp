name: Simulator Screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/screenshots.yml"
      - "NimLoginApp/**"
      - "NimLoginApp.xcodeproj/**"
      - "NimLoginAppUITests/**"

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -80

      - name: Build app for simulator
        run: |
          xcodebuild \
            -project NimLoginApp.xcodeproj \
            -scheme NimLoginApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot simulator and take screenshots
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/NimLoginApp.app"
          test -d "$APP_PATH"

          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and "iPhone" in d["name"]:
                      print(d["udid"]); sys.exit(0)
          ')"

          if [ -z "$DEVICE_ID" ]; then
            TYPE_ID="$(xcrun simctl list devicetypes -j | python3 -c '
          import json,sys
          for t in json.load(sys.stdin)["devicetypes"]:
              if t["name"].startswith("iPhone"):
                  print(t["identifier"]); break
          ')"
            RUNTIME_ID="$(xcrun simctl list runtimes -j | python3 -c '
          import json,sys
          for r in json.load(sys.stdin)["runtimes"]:
              if r.get("isAvailable") and "iOS" in r["name"]:
                  print(r["identifier"]); break
          ')"
            DEVICE_ID="$(xcrun simctl create ScreenshotPhone "$TYPE_ID" "$RUNTIME_ID")"
          fi

          echo "Using simulator: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

          echo "Running unit tests (isolated derived data, before app install)..."
          mkdir -p build
          set +e
          xcodebuild test \
            -project NimLoginApp.xcodeproj \
            -scheme NimLoginApp \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:NimLoginAppTests \
            -derivedDataPath build/TestDerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/unit-test.log
          UNIT_TEST_STATUS=${PIPESTATUS[0]}
          set -e
          echo "$UNIT_TEST_STATUS" > build/unit-test-status.txt
          if [ "$UNIT_TEST_STATUS" != "0" ]; then
            echo "Unit tests failed (status $UNIT_TEST_STATUS); continuing so screenshots still publish. Tail of log:"
            tail -80 build/unit-test.log || true
          else
            echo "Unit tests passed."
          fi

          # xcodebuild test shuts the simulator down when it finishes; boot it again before installing.
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"

          mkdir -p screenshots
          for mode in login login-error register home login-dark home-dark diagnostics; do
            xcrun simctl terminate "$DEVICE_ID" com.nim.NimLoginApp || true
            # Clear any saved session so each screenshot starts clean.
            xcrun simctl spawn "$DEVICE_ID" defaults delete com.nim.NimLoginApp 2>/dev/null || true
            xcrun simctl launch "$DEVICE_ID" com.nim.NimLoginApp "SCREENSHOT=$mode"
            sleep 6
            xcrun simctl io "$DEVICE_ID" screenshot "screenshots/$mode.png"
            # A black/blank capture is ~70KB while a rendered screen is >150KB.
            # If the app had not rendered its first frame yet, wait and retake once.
            SIZE=$(stat -f%z "screenshots/$mode.png" 2>/dev/null || echo 0)
            if [ "$SIZE" -lt 90000 ]; then
              echo "Screenshot $mode.png looks blank (${SIZE} bytes); retaking after extra wait..."
              sleep 4
              xcrun simctl io "$DEVICE_ID" screenshot "screenshots/$mode.png"
            fi
          done
          ls -lh screenshots

          echo "Building UI tests before recording (keeps home-screen wait out of the video)..."
          xcodebuild build-for-testing \
            -project NimLoginApp.xcodeproj \
            -scheme NimLoginAppUITests \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO

          echo "Recording FULL app flow video (real UI test taps)..."
          mkdir -p videos build/test-results
          xcrun simctl terminate "$DEVICE_ID" com.nim.NimLoginApp || true
          xcrun simctl uninstall "$DEVICE_ID" com.nim.NimLoginApp || true
          xcrun simctl io "$DEVICE_ID" recordVideo --codec=h264 videos/full-app-flow.mp4 &
          RECORD_PID=$!
          sleep 2
          set +e
          xcodebuild test-without-building \
            -project NimLoginApp.xcodeproj \
            -scheme NimLoginAppUITests \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:NimLoginAppUITests/FullFlowUITests/testFullAppFlow \
            -resultBundlePath build/test-results/FullFlow.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/full-flow-test.log
          TEST_STATUS=${PIPESTATUS[0]}
          set -e
          sleep 2
          kill -INT "$RECORD_PID" || true
          ( sleep 12; kill -9 "$RECORD_PID" 2>/dev/null ) &
          wait "$RECORD_PID" || true
          ls -lh videos
          if [ "$TEST_STATUS" != "0" ]; then
            echo "Full flow UI test failed, see log"; tail -120 build/full-flow-test.log || true
            # Keep the step green so screenshots/video still publish; full log is in the test log artifact step below.
          fi
          # Compress so the recording can actually be downloaded/viewed
          # (the raw 1206x2622 capture is ~30-60 MB and transfers keep failing).
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -y -i videos/full-app-flow.mp4 -vf "scale=iw/2:ih/2" -c:v libx264 -crf 30 -preset veryfast -an videos/full-app-flow-small.mp4 \
              && mv videos/full-app-flow-small.mp4 videos/full-app-flow.mp4 || true
            ls -lh videos
          fi
          # Backward-compatible name expected by docs/README video link.
          cp videos/full-app-flow.mp4 videos/fault-analysis-flow.mp4 || true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots/*.png
          if-no-files-found: error

      - name: Upload flow video
        uses: actions/upload-artifact@v4
        with:
          name: fault-analysis-video
          path: videos/*.mp4
          if-no-files-found: error

      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: build/unit-test.log
          if-no-files-found: warn

      - name: Commit screenshots to docs
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs/screenshots docs/videos
          cp screenshots/*.png docs/screenshots/
          cp videos/fault-analysis-flow.mp4 docs/videos/ 2>/dev/null || true
          cp videos/full-app-flow.mp4 docs/videos/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Base the commit on the latest main to avoid binary rebase conflicts
          # when another run advanced main while this run was recording.
          # Save fresh captures aside first: checkout -f would discard the docs copies.
          mkdir -p /tmp/captures
          cp -R screenshots /tmp/captures/ 2>/dev/null || true
          cp -R videos /tmp/captures/ 2>/dev/null || true
          git fetch origin main
          git checkout -f -B main origin/main
          mkdir -p docs/screenshots docs/videos
          cp /tmp/captures/screenshots/*.png docs/screenshots/
          cp /tmp/captures/videos/fault-analysis-flow.mp4 docs/videos/ 2>/dev/null || true
          cp /tmp/captures/videos/full-app-flow.mp4 docs/videos/ 2>/dev/null || true
          git add docs/screenshots/login.png docs/screenshots/login-error.png docs/screenshots/register.png docs/screenshots/home.png docs/screenshots/login-dark.png docs/screenshots/home-dark.png docs/screenshots/diagnostics.png docs/videos/fault-analysis-flow.mp4 docs/videos/full-app-flow.mp4
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "docs: update simulator screenshots [skip ci]"
            git push origin HEAD:main
          fi

      - name: Fail if unit tests failed
        if: always()
        run: |
          STATUS="$(cat build/unit-test-status.txt 2>/dev/null || echo missing)"
          echo "Unit test exit status: $STATUS"
          if [ "$STATUS" != "0" ]; then
            echo "Unit tests did not pass; see unit-test.log artifact."
            tail -60 build/unit-test.log || true
            exit 1
          fi

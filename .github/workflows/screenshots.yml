name: Simulator Screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/screenshots.yml"
      - "NimLoginApp/**"
      - "NimLoginApp.xcodeproj/**"

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -80

      - name: Build app for simulator
        run: |
          xcodebuild \
            -project NimLoginApp.xcodeproj \
            -scheme NimLoginApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot simulator and take screenshots
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/NimLoginApp.app"
          test -d "$APP_PATH"

          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and "iPhone" in d["name"]:
                      print(d["udid"]); sys.exit(0)
          ')"

          if [ -z "$DEVICE_ID" ]; then
            TYPE_ID="$(xcrun simctl list devicetypes -j | python3 -c '
          import json,sys
          for t in json.load(sys.stdin)["devicetypes"]:
              if t["name"].startswith("iPhone"):
                  print(t["identifier"]); break
          ')"
            RUNTIME_ID="$(xcrun simctl list runtimes -j | python3 -c '
          import json,sys
          for r in json.load(sys.stdin)["runtimes"]:
              if r.get("isAvailable") and "iOS" in r["name"]:
                  print(r["identifier"]); break
          ')"
            DEVICE_ID="$(xcrun simctl create ScreenshotPhone "$TYPE_ID" "$RUNTIME_ID")"
          fi

          echo "Using simulator: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"

          mkdir -p screenshots
          for mode in login login-error register home login-dark home-dark diagnostics; do
            xcrun simctl terminate "$DEVICE_ID" com.nim.NimLoginApp || true
            # Clear any saved session so each screenshot starts clean.
            xcrun simctl spawn "$DEVICE_ID" defaults delete com.nim.NimLoginApp 2>/dev/null || true
            xcrun simctl launch "$DEVICE_ID" com.nim.NimLoginApp "SCREENSHOT=$mode"
            sleep 4
            xcrun simctl io "$DEVICE_ID" screenshot "screenshots/$mode.png"
          done
          ls -lh screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots/*.png
          if-no-files-found: error

      - name: Commit screenshots to docs
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs/screenshots
          cp screenshots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/login.png docs/screenshots/login-error.png docs/screenshots/register.png docs/screenshots/home.png docs/screenshots/login-dark.png docs/screenshots/home-dark.png docs/screenshots/diagnostics.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "docs: update simulator screenshots [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
